<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech Project Intelligence — Athena Education</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#ffffff;--bg2:#f5f5f3;--bg3:#eeede9;
    --text:#1a1a18;--text2:#6b6b66;--text3:#9b9b96;
    --border:rgba(0,0,0,0.12);--border2:rgba(0,0,0,0.22);
    --radius-md:8px;--radius-lg:12px;--radius-xl:16px;
    --font:'DM Sans',system-ui,sans-serif;
  }
  @media(prefers-color-scheme:dark){
    :root{
      --bg:#1c1c1a;--bg2:#252523;--bg3:#2e2e2c;
      --text:#f0efeb;--text2:#a0a09a;--text3:#6a6a65;
      --border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.2);
    }
    .badge-iot{background:#04342C!important;color:#9FE1CB!important}
    .badge-ai{background:#26215C!important;color:#CECBF6!important}
    .badge-robotics{background:#4A1B0C!important;color:#F5C4B3!important}
    .badge-hardware{background:#412402!important;color:#FAC775!important}
    .badge-env{background:#173404!important;color:#C0DD97!important}
    .badge-biotech{background:#4B1528!important;color:#F4C0D1!important}
    .badge-web{background:#042C53!important;color:#B5D4F4!important}
    .stat{background:var(--bg2)!important}
    .card{background:var(--bg)!important}
    .snap:hover,.snap.active{background:var(--text)!important;color:var(--bg)!important}
    .modal{background:var(--bg)!important}
    .card-level{background:var(--bg2)!important}
  }
  body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;padding:24px 20px 60px}
  a{color:inherit}
  .shell{max-width:1100px;margin:0 auto}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:.75rem}
  .brand{display:flex;flex-direction:column;gap:2px}
  .brand-name{font-size:20px;font-weight:600;color:var(--text);letter-spacing:-.02em}
  .brand-sub{font-size:12px;color:var(--text2)}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .search-wrap{position:relative}
  .search-wrap input{padding:7px 10px 7px 30px;width:210px;font-size:13px;font-family:var(--font);background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius-md);color:var(--text);outline:none}
  .search-wrap input:focus{border-color:var(--border2)}
  .search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text2);pointer-events:none}
  select{font-size:13px;font-family:var(--font);padding:7px 10px;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius-md);color:var(--text);outline:none;cursor:pointer}
  select:focus{border-color:var(--border2)}
  .stats-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:1.5rem}
  @media(max-width:600px){.stats-row{grid-template-columns:repeat(2,1fr)}}
  .stat{background:var(--bg2);border-radius:var(--radius-md);padding:12px 14px}
  .stat-num{font-size:24px;font-weight:600;color:var(--text)}
  .stat-label{font-size:11px;color:var(--text2);margin-top:2px;text-transform:uppercase;letter-spacing:.04em}
  .tabs{display:flex;gap:0;border-bottom:0.5px solid var(--border);margin-bottom:1.1rem;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{font-size:12px;font-weight:500;color:var(--text2);padding:8px 14px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:all .15s;user-select:none}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--text);border-bottom-color:var(--text)}
  .snap-row{display:flex;gap:8px;margin-bottom:1.25rem;flex-wrap:wrap}
  .snap{font-size:11px;font-weight:500;padding:5px 12px;border-radius:20px;cursor:pointer;background:var(--bg2);color:var(--text2);border:0.5px solid var(--border);transition:all .15s;user-select:none}
  .snap:hover,.snap.active{background:var(--text);color:var(--bg)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
  .card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:15px 16px;cursor:pointer;transition:border-color .15s;display:flex;flex-direction:column;gap:8px}
  .card:hover{border-color:var(--border2)}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .card-title{font-size:14px;font-weight:500;color:var(--text);line-height:1.35}
  .badge{font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0;text-transform:uppercase;letter-spacing:.04em}
  .badge-iot{background:#E1F5EE;color:#0F6E56}
  .badge-ai{background:#EEEDFE;color:#3C3489}
  .badge-robotics{background:#FAECE7;color:#993C1D}
  .badge-web{background:#E6F1FB;color:#185FA5}
  .badge-hardware{background:#FAEEDA;color:#854F0B}
  .badge-env{background:#EAF3DE;color:#3B6D11}
  .badge-biotech{background:#FBEAF0;color:#993556}
  .card-desc{font-size:12px;color:var(--text2);line-height:1.55;flex:1}
  .card-award{font-size:10px;color:#854F0B;font-weight:600}
  .card-meta{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
  .card-source{font-size:11px;color:var(--text3)}
  .card-level{font-size:10px;font-weight:500;padding:2px 7px;border-radius:12px;background:var(--bg2);color:var(--text2)}
  .empty{text-align:center;padding:4rem 1rem;color:var(--text2);font-size:14px}
  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:48px 16px;overflow-y:auto}
  .modal{background:var(--bg);border-radius:var(--radius-xl);border:0.5px solid var(--border2);padding:24px;max-width:560px;width:100%;position:relative}
  .modal-close{position:absolute;top:16px;right:18px;cursor:pointer;font-size:20px;color:var(--text2);line-height:1;background:none;border:none;font-family:inherit}
  .modal-badge{margin-bottom:10px}
  .modal-title{font-size:19px;font-weight:600;margin-bottom:6px;color:var(--text);line-height:1.3}
  .modal-award{font-size:12px;color:#854F0B;font-weight:600;margin-bottom:4px}
  .modal-meta{font-size:12px;color:var(--text2);margin-bottom:16px}
  .modal-section{margin-bottom:14px}
  .modal-section h4{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text2);margin-bottom:5px}
  .modal-section p{font-size:13px;color:var(--text);line-height:1.6}
  .tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .tag{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--bg2);color:var(--text2);border:0.5px solid var(--border)}
  .source-link{font-size:12px;color:#185FA5;text-decoration:none;display:inline-block;margin-top:6px}
  .source-link:hover{text-decoration:underline}
  .footer{margin-top:3rem;text-align:center;font-size:11px;color:var(--text3)}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>

const CATS=[

];
const SOURCES=["All sources","MIT Lab / Media Lab","Regeneron ISEF 2025","Regeneron ISEF 2024","Athena Scholar","MIT Manipal","ISEF Special Award"];
const LEVELS=["All levels","High School","University"];

let state={cat:"all",source:"All sources",level:"All levels",q:"",modal:null};

function badgeClass(c){return"badge badge-"+c}
function levelLabel(l){return l==="High School"?"High School":"University"}

function matchProject(p){
  const q=state.q.toLowerCase();
  if(state.cat!=="all"&&p.category!==state.cat)return false;
  if(state.level!=="All levels"&&p.level!==state.level)return false;
  if(state.source!=="All sources"){
    if(state.source==="MIT Lab / Media Lab"&&!p.source.includes("MIT"))return false;
    if(state.source==="Regeneron ISEF 2025"&&p.source!=="Regeneron ISEF 2025")return false;
    if(state.source==="Regeneron ISEF 2024"&&p.source!=="Regeneron ISEF 2024")return false;
    if(state.source==="Athena Scholar"&&!p.source.includes("Athena"))return false;
    if(state.source==="MIT Manipal"&&!p.source.includes("Manipal"))return false;
    if(state.source==="ISEF Special Award"&&!p.source.includes("ISEF Special"))return false;
  }
  if(q&&!(p.title.toLowerCase().includes(q)||p.desc.toLowerCase().includes(q)||p.domain.toLowerCase().includes(q)))return false;
  return true;
}

      </div>
      <select onchange="updateLevel(this.value)">${LEVELS.map(l=>`<option${state.level===l?" selected":""}>${l}</option>`).join("")}</select>
      <select onchange="updateSource(this.value)" style="max-width:170px">${SOURCES.map(s=>`<option${state.source===s?" selected":""}>${s}</option>`).join("")}</select>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat"><div class="stat-num">${PROJECTS.length}</div><div class="stat-label">Total projects</div></div>
    <div class="stat"><div class="stat-num">${hsCount}</div><div class="stat-label">High school</div></div>
    <div class="stat"><div class="stat-num">${aiCount+iotCount}</div><div class="stat-label">AI &amp; IoT</div></div>
    <div class="stat"><div class="stat-num">${PROJECTS.filter(p=>p.award).length}</div><div class="stat-label">Award-winning</div></div>
  </div>

  <div class="tabs">
    ${CATS.map(c=>`<div class="tab${state.cat===c.key?" active":""}" onclick="updateCat('${c.key}')">${c.label}</div>`).join("")}
  </div>

  <div class="snap-row">
    <div class="snap${state.source==="All sources"&&state.level==="All levels"&&state.cat==="all"&&state.q===""?" active":""}" onclick="quickFilter('all')">All</div>
    <div class="snap" onclick="quickFilter('hs25')">ISEF 2025</div>
    <div class="snap" onclick="quickFilter('mit')">MIT Labs</div>
    <div class="snap" onclick="quickFilter('athena')">Athena Projects</div>
    <div class="snap" onclick="quickFilter('uni')">University Level</div>
  </div>
  `;

  if(filtered.length===0){
    html+=`<div class="empty">No projects match — try adjusting the filters or search term.</div>`;
  }else{
    html+=`<div class="grid">`;
    for(const p of filtered){
      const desc=p.desc.length>115?p.desc.slice(0,115)+"…":p.desc;
      html+=`<div class="card" onclick="openModal(${p.id})">
        <div class="card-top"><div class="card-title">${p.title}</div><span class="${badgeClass(p.category)}">${p.category}</span></div>
        <div class="card-desc">${desc}</div>
        ${p.award?`<div class="card-award">&#11042; ${p.award}</div>`:""}
        <div class="card-meta"><div class="card-source">${p.institution} &middot; ${p.year}</div><div class="card-level">${levelLabel(p.level)}</div></div>
      </div>`;
    }
    html+=`</div>`;
  }

  app.innerHTML=html;

  if(state.modal){
    const p=PROJECTS.find(x=>x.id===state.modal);
    if(p){
      const ov=document.createElement("div");
      ov.className="overlay";
      ov.id="overlay";
      ov.onclick=function(e){if(e.target===ov)closeModal()};
      ov.innerHTML=`<div class="modal">
        <button class="modal-close" onclick="closeModal()">&times;</button>
        <div class="modal-badge"><span class="${badgeClass(p.category)}">${p.category.toUpperCase()}</span></div>
        <div class="modal-title">${p.title}</div>
        ${p.award?`<div class="modal-award">&#11042; ${p.award}</div>`:""}
        <div class="modal-meta">${p.institution} &middot; ${p.source} &middot; ${p.year}</div>
        <div class="modal-section"><h4>Overview</h4><p>${p.desc}</p></div>
        <div class="modal-section"><h4>Domain &amp; level</h4><p>${p.domain} &nbsp;&middot;&nbsp; ${p.level}</p></div>
        <div class="modal-section"><h4>Key components</h4><div class="tag-row">${p.components.map(c=>`<span class="tag">${c}</span>`).join("")}</div></div>
        <div class="modal-section"><h4>Impact</h4><p>${p.impact}</p></div>
        ${p.reference?`<a class="source-link" href="${p.reference}" target="_blank" rel="noopener">View source &#8599;</a>`:""}
      </div>`;
      document.body.appendChild(ov);
    }
  }
}

function updateCat(c){state.cat=c;cleanup();renderApp()}
function updateLevel(v){state.level=v;cleanup();renderApp()}
function updateSource(v){state.source=v;cleanup();renderApp()}
function updateQ(v){state.q=v;cleanup();renderApp()}
function openModal(id){state.modal=id;renderApp()}
function closeModal(){state.modal=null;cleanup();renderApp()}
function cleanup(){const o=document.getElementById("overlay");if(o)o.remove()}
function quickFilter(t){
  cleanup();
  if(t==="all"){state.source="All sources";state.level="All levels";state.cat="all";state.q=""}
  else if(t==="hs25"){state.source="Regeneron ISEF 2025";state.level="High School";state.cat="all";state.q=""}
  else if(t==="mit"){state.source="MIT Lab / Media Lab";state.level="All levels";state.cat="all";state.q=""}
  else if(t==="athena"){state.source="Athena Scholar";state.level="All levels";state.cat="all";state.q=""}
  else if(t==="uni"){state.source="All sources";state.level="University";state.cat="all";state.q=""}
  renderApp();
}

renderApp();
</script>
</body>
</html>
